<header>
  <h1>MongoDB Arrays & Schema Awareness</h1>
  <p>Querying Arrays and Avoiding Silent Schema Bugs</p>
</header>

<div class="container">

  <p>
    MongoDB becomes truly powerful when you understand how it works with arrays
    and schema flexibility. This is also where many beginners make silent mistakes.
  </p>

  <h2>Prerequisite: Insert Practice Data</h2>

  <h3>Select Database</h3>
  <pre>use codinggita</pre>

  <h3>Insert Sample Documents</h3>

  <pre>
db.jobs.insertMany([
  {
    role: "Backend Developer",
    experience: 3,
    skills: ["Node.js", "MongoDB", "Express"],
    location: "Bangalore",
    salary: 1200000
  },
  {
    role: "Frontend Developer",
    experience: 2,
    skills: ["React", "JavaScript", "CSS"],
    location: "Remote",
    salary: 900000
  },
  {
    role: "Full Stack Developer",
    experience: 4,
    skills: ["React", "Node.js", "MongoDB"],
    location: "Hyderabad",
    salary: 1500000
  }
]);
  </pre>

  <div class="note">
    These documents intentionally use arrays and consistent schema for learning.
  </div>

  <h2>1. Understanding Arrays in MongoDB</h2>

  <p>
    Arrays are first-class citizens in MongoDB. You can query them directly
    without special syntax in most cases.
  </p>

  <pre>"skills": ["Node.js", "MongoDB", "Express"]</pre>

  <h2>2. Matching a Value Inside an Array</h2>

  <pre>
db.jobs.find({
  skills: "MongoDB"
})
  </pre>

  <div class="note">
    MongoDB automatically checks each element inside the array.
  </div>

  <h2>3. Matching Multiple Array Values</h2>

  <table>
    <tr>
      <th>Operator</th>
      <th>Meaning</th>
      <th>Logic</th>
    </tr>
    <tr>
      <td>$all</td>
      <td>Array contains all values</td>
      <td>AND</td>
    </tr>
  </table>

  <pre>
db.jobs.find({
  skills: { $all: ["React", "Node.js"] }
})
  </pre>

  <h2>4. Querying by Array Length</h2>

  <table>
    <tr>
      <th>Operator</th>
      <th>Meaning</th>
    </tr>
    <tr>
      <td>$size</td>
      <td>Matches exact array length</td>
    </tr>
  </table>

  <pre>
db.jobs.find({
  skills: { $size: 3 }
})
  </pre>

  <div class="warning">
    $size matches only exact length — it does not support ranges.
  </div>

  <h2>5. Arrays with Other Filters</h2>

  <pre>
db.jobs.find({
  role: "Backend Developer",
  skills: "MongoDB"
})
  </pre>

  <p>
    MongoDB applies implicit AND and automatically handles array matching.
  </p>

  <h2>6. Schema Awareness (Critical)</h2>

  <div class="rule">
    MongoDB is schema-flexible, not schema-random.
  </div>

  <h3>Good Schema</h3>
  <pre>{ "experience": 3 }</pre>

  <h3>Bad Schema</h3>
  <pre>{ "experience": "3" }</pre>

  <h2>7. Silent Bugs from Inconsistent Schema</h2>

  <pre>db.jobs.find({ experience: { $gt: 2 } })</pre>

  <div class="warning">
    Documents where experience is stored as a string will be ignored silently.
  </div>

  <h2>8. Arrays vs Strings (Common Mistake)</h2>

  <h3>❌ Wrong</h3>
  <pre>"skills": "MongoDB"</pre>

  <h3>✅ Correct</h3>
  <pre>"skills": ["MongoDB"]</pre>

  <h2>9. MongoDB Does Not Auto-Fix Schema</h2>

  <ul>
    <li>No warnings</li>
    <li>No automatic conversions</li>
    <li>No schema enforcement by default</li>
  </ul>

  <div class="note">
    Flexibility gives power — but also responsibility.
  </div>

  <h2>Key Takeaways</h2>

  <ul>
    <li>MongoDB queries arrays naturally</li>
    <li>$all and $size are essential array operators</li>
    <li>Schema inconsistency causes silent bugs</li>
    <li>Arrays must be stored as arrays</li>
    <li>Good developers think about schema early</li>
  </ul>
